<!DOCTYPE html>
<html>

<head>
    <title>React Basics</title>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function InputText({ setInputText,inputText }) {
            function setText(event) {
                setInputText(event.target.value);
            }
            return (
                <>
                    <input type="text" onChange={setText} value={inputText}  placeholder="Type a name here" />
                </>
            );
        }
        function Reset({ setInputText }) {
            function resetText() {
                setInputText('');
            }
            return (
                <>
                    <button onClick={resetText}>Reset</button>
                </>
            );
        }

        function Example({ setInputText }) {
            function exampleText(event) {
                setInputText('Dharmesh');
            }
            return (
                <>
                    <button onClick={exampleText}>Example</button>
                </>
            );
        }

        function App() {
            const [inputText, setInputText] = React.useState('');
            return (
                <>
                    <div>
                        <InputText setInputText={setInputText} inputText={inputText} />
                        <Reset setInputText={setInputText} />
                        <Example setInputText={setInputText} />
                    </div>
                    <p>{inputText}</p>
                </>
            );
        }
        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html
